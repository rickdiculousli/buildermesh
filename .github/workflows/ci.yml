name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: mkdir -p "$HOME/.cache/bmesh-scratch/tmp"
      - run: TMPDIR=$HOME/.cache/bmesh-scratch/tmp go test -count=1 ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: GOOS=windows go build ./...
      - run: GOOS=darwin go build ./...
