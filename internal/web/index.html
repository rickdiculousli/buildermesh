<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>bmesh</title>
<link rel="stylesheet" href="/map.css">
<script src="/map.js" defer></script>
</head>
<body>
<header id="top">
  <h1><a href="#/">bmesh</a></h1>
  <span id="conn" class="conn">connecting</span>
  <nav>
    <a href="#/" data-route="map">map</a>
    <a href="#/routines" data-route="routines">routines</a>
  </nav>
</header>
<div id="strip" class="strip" hidden></div>
<main>
  <section id="view-map" class="view">
    <div id="map" class="map"></div>
    <p id="map-empty" class="empty" hidden>No nodes on the mesh yet.</p>
  </section>
  <section id="view-lead" class="view" hidden>
    <h2 id="lead-title"></h2>
    <div id="lead-head" class="lead-head"></div>
    <div id="lead-panel" class="panel"></div>
  </section>
  <section id="view-routines" class="view" hidden>
    <h2>routines</h2>
    <div id="routines-panel" class="panel"></div>
  </section>
</main>
<details id="drawer" class="drawer">
  <summary>recent events <span id="drawer-count" class="count"></span></summary>
  <ol id="recent"></ol>
</details>
</body>
</html>
