<text class="wm wb" x="330" y="106" textLength="193" lengthAdjust="spacingAndGlyphs">builder</text><text class="wm wmsh" x="524" y="106" textLength="160" lengthAdjust="spacingAndGlyphs">mesh</text>
<rect class="chip" x="706" y="72" width="76" height="28" rx="14"/><text class="chipt" x="744" y="91" text-anchor="middle">bmesh</text>
<text class="tag" x="332" y="154">A mesh for coding agents that propose, build, verify</text>
<text class="tag" x="332" y="183">and land changes on main, across every box you own.</text>
<text class="st" x="332" y="226">propose<tspan class="ar"> → </tspan>choose<tspan class="ar"> → </tspan>build<tspan class="ar"> → </tspan>verify<tspan class="ar"> → </tspan>land</text>
</svg>
