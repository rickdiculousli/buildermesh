<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="buildermesh (bmesh): A mesh for coding agents that propose, build, verify and land changes on main, across every box you own.">
<title>buildermesh (bmesh)</title>
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="114" y1="58" x2="278" y2="222"><stop offset="0" stop-color="#39c5bb"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
<linearGradient id="w" gradientUnits="userSpaceOnUse" x1="524" y1="0" x2="684" y2="0"><stop offset="0" stop-color="#39c5bb"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#131a24"/></linearGradient>
<pattern id="lat" width="40" height="69.28" patternUnits="userSpaceOnUse"><g fill="#222a35"><circle cx="0" cy="0" r="1.6"/><circle cx="40" cy="0" r="1.6"/><circle cx="20" cy="34.64" r="1.6"/><circle cx="0" cy="69.28" r="1.6"/><circle cx="40" cy="69.28" r="1.6"/></g></pattern>
<radialGradient id="fade" cx="0.2" cy=".5" r=".8"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="lm"><rect width="960" height="280" fill="url(#fade)"/></mask>
</defs>
<style>
.ft{fill:url(#g);opacity:.30}.fl{fill:url(#g);opacity:.16}.fr{fill:url(#g);opacity:.22}
.e path{stroke:url(#g);stroke-width:2.4;fill:none;stroke-linecap:round}
.nd{fill:#0d1117;stroke:url(#g);stroke-width:2.6}.nd.ok{stroke:#3fb950;fill:#3fb950;fill-opacity:.25}
.hub{fill:url(#g)}.hg{fill:url(#g);opacity:.18}
.mv{opacity:0;offset-rotate:0deg}.mv .gl{opacity:.3}
.mv.j{fill:#d29922}.mv.r{fill:#a371f7}.mv.ok{fill:#3fb950}
.q0{animation:mv 11s 0s ease-in-out infinite}.k0{animation:nd 11s 1s ease-out infinite}
.q1{animation:mv 11s 1.3s ease-in-out infinite}.k1{animation:nd 11s 2.3s ease-out infinite}
.q2{animation:mv 11s 2.5s ease-in-out infinite}.k2{animation:nd 11s 3.5s ease-out infinite}
.q3{animation:mv 11s 3.8s ease-in-out infinite}.k3{animation:nd 11s 4.8s ease-out infinite}
.q4{animation:mv 11s 5s ease-in-out infinite}.k4{animation:nd 11s 6s ease-out infinite}
.q5{animation:mv 11s 6.3s ease-in-out infinite}.k5{animation:nd 11s 7.3s ease-out infinite}
@keyframes mv{0%{offset-distance:0%;opacity:0}1.5%{opacity:1}8%{offset-distance:100%;opacity:1}10%,100%{offset-distance:100%;opacity:0}}
@keyframes nd{0%{stroke-width:2.6}2.5%{stroke-width:5.5}9%,100%{stroke-width:2.6}}
@supports not (offset-path:path('M0 0')){.mv{display:none}}
.hg{animation:hg 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes hg{0%,100%{opacity:.10;transform:scale(.85)}50%{opacity:.26;transform:scale(1.08)}}
.wm{font:700 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:-1.5px}.wb{fill:#e6edf3}.wmsh{fill:url(#w)}
.tag{font:400 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e6edf3}
.st{font:500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#8b949e}.ar{fill:#39c5bb}
.chip{fill:#161b22;stroke:#30363d}.chipt{font:600 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#8b949e}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="958" height="278" rx="12" fill="url(#bg)"/>
<rect x="1" y="1" width="958" height="278" rx="12" fill="url(#lat)" mask="url(#lm)"/>
<rect x="1" y="1" width="958" height="278" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>
