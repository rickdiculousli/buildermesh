# Upgrade notes for v0.5.0, distilled from the Upgrading sections of the
# specs it carries. 095 has the binary carry its plugin: each box with
# Claude Code switches once to the copy its binary writes, a run step; a
# box without claude has nothing to switch (the command refuses there), so
# the step is guarded. 094's [context] levels suit a 1M window, so they are
# in the summary, not an ask that would hold a box's own update. 093 needs
# nothing.

summary = "The binary now carries its plugin: run bmesh plugin --install once (the step below) and from then on a box's skills move with its bmesh update, with no checkout to pull or approve. Sessions now hear their own context: in a Claude Code session, a bmesh command ends with one stderr line when the context crosses a nudge, and says when to compact; the [context] defaults (nudge_from = 250000, nudge_every = 50000, compact_from = 300000, compact_soon = 400000) suit a 1M-token window, so for a smaller one set all four lower in config.toml, and nudge_from = 0 turns it off. A box's held self-level now says it waits for your approval and how to give it, in its push, the session line and mesh-status."

[[step]]
kind = "run"
command = "if command -v claude >/dev/null 2>&1; then bmesh plugin --install; else echo 'no claude on PATH: nothing to switch'; fi"
why = "sessions load the plugin this binary carries, from bmesh's own dir, instead of a checkout"
os = ["linux", "darwin"]

[[step]]
kind = "run"
command = "where claude >nul 2>&1 && bmesh plugin --install || echo no claude on PATH: nothing to switch"
why = "sessions load the plugin this binary carries, from bmesh's own dir, instead of a checkout"
os = ["windows"]
