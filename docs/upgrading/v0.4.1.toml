# Upgrade notes for v0.4.1, distilled from the Upgrading sections of the
# specs it carries. 072 makes the hub restart itself onto each release serve
# runs, on Linux and macOS; a hub from an earlier release doesn't do that yet,
# so this release restarts it once, as v0.3.0's notes do, and Windows keeps
# its hand restart. 082 starts a model routine's claude with only the tools
# its kind's allow names: that is a line in each repo's
# .bmesh/routines/<kind>.toml, not a step a box takes, so it is in the
# summary. 066, 067, 068, 076, 086 and 087 need nothing.

summary = "Restart the hub once; from this release on, on Linux and macOS, it restarts itself onto each release. A model routine now sees only Read, Grep, Glob and the tools its kind's allow names, with no skills or MCP servers: a kind whose prompt uses a skill adds \"Skill\" to allow in its repo's .bmesh/routines/<kind>.toml, and one that uses an MCP tool adds \"mcp__<server>__<tool>\"."

[[step]]
kind = "run"
why = "bmesh hub runs the binary it started with, and a hub from before this release doesn't restart itself: restart it once so it runs this release (a hub run by hand, restart it yourself)"
os = ["linux"]
when = '[hub] role != ""'
command = '''
if [ -f "${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/bmesh-hub.service" ]; then
  systemctl --user restart bmesh-hub && echo "restarted bmesh-hub"
else
  echo "no bmesh-hub unit: restart bmesh hub yourself"
fi
'''

[[step]]
kind = "run"
why = "bmesh hub runs the binary it started with, and a hub from before this release doesn't restart itself: restart it once so it runs this release (a hub run by hand, restart it yourself)"
os = ["darwin"]
when = '[hub] role != ""'
command = '''
if [ -f "$HOME/Library/LaunchAgents/com.buildermesh.bmesh-hub.plist" ]; then
  launchctl kickstart -k "gui/$(id -u)/com.buildermesh.bmesh-hub" && echo "restarted bmesh-hub"
else
  echo "no bmesh-hub agent: restart bmesh hub yourself"
fi
'''

[[step]]
kind = "run"
why = "bmesh hub runs the binary it started with, and init sets up no hub service on Windows: end the bmesh hub you run and start it again, so it runs this release"
os = ["windows"]
when = '[hub] role != ""'
confirm = true
command = '''echo end bmesh hub and start it again (bmesh hub)'''
