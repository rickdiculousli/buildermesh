# Upgrade notes for v0.6.0, distilled from the Upgrading sections of the
# specs it carries. 049 adds [serve] stale_after, asked below. 105's daemon
# provisions bm-usage and reads its own transcripts, 069's skills come with
# the binary that has bmesh spec rulings, 112's half-pager change leaves a
# repo's own brief alone, 064's dialog needs no setting, and 106 to 108
# draw the console from what 105 publishes: none needs a step.

summary = "One question: how old a need grows before the map folds it away. On a Mac, every use of the admin or approve key now first shows a bmesh: dialog naming what it signs; a Keychain prompt about bmesh with no such dialog before it is not bmesh's: deny it. Each box puts its agents' token use on the mesh once it runs this release (bmesh usage reads it), and the map becomes a console that draws it with flags for runaway agents."

[[step]]
kind = "ask"
key = "[serve] stale_after"
changed = "the map folds a blocked, asking or silent state older than this into one older line under the needs-you band."
question = "How old should a need grow before it folds away?"
choices = ["6h", "2h", "24h", "0"]
default = "6h"
