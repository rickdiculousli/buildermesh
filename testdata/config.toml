[mesh]
nats = "nats://hub.example:4222"
domain = "lab"
token_file = "~/secrets/bm.token"
store = "~/state/bm/js"
listen = "127.0.0.1:4333"
[host]
name = "Box-One"
[serve]
listen = "127.0.0.1:3999"
[runner]
kind = "tmux"
t3_dispatch = "~/bin/t3_dispatch.py"
t3_project = "bm"
tmux_session = "mesh"
worktrees = "~/wt"
checkouts = "~/co"
claude = "claude --debug"
max_leads = 4
[notify]
ntfy = "http://ntfy.example/bm"
command = "cat"
digest_every = "30m"
push = ["ask", "done"]
map_url = "http://map.example/"
catch_up = "2h"
[liveness]
grace = "5m"
poll_every = "15s"
wake_every = "2m"
[spec]
glob = "specs/{id}.md"
[models]
lead = "lead-model"
[quota]
command = "cat quota.json"
[console]
thread_url = "http://box-one:3773/t/{thread}"
[console.hosts]
other = "http://other:3773/t/{thread}"
